name: landing

on:
  push:
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверка статики лендинга
        run: node landing/scripts/check.mjs
