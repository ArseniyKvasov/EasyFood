<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена - BiteBalance</title>
<meta name="description" content="Такой страницы нет. Вернитесь на главную BiteBalance.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--cream:#FAF6EF;--ink:#1B211D;--muted:#77827A;--green:#2F6B4F;--lime:#C9F26B;--mont:"Montserrat",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-family:var(--sans);text-align:center;padding:28px}
  .wrap{max-width:520px}
  .mark{width:56px;height:56px;margin:0 auto 26px;display:block;border-radius:16px;overflow:hidden;box-shadow:0 18px 30px -22px rgba(30,70,52,.9)}
  .code{font-family:var(--mont);font-size:clamp(60px,14vw,104px);font-weight:800;letter-spacing:-.05em;line-height:.9;color:var(--green);margin:0}
  h1{font-family:var(--mont);font-size:clamp(20px,4vw,26px);font-weight:800;letter-spacing:-.02em;margin:18px 0 10px}
  p{margin:0 0 26px;color:var(--muted);font-size:15.5px;line-height:1.6}
  a.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:999px;background:var(--green);color:#F7FBF4;text-decoration:none;font-family:var(--mont);font-weight:600;font-size:14.5px;transition:background-color .4s ease,transform .4s ease}
  a.btn:hover{background:#1E4634;transform:translateY(-1px)}
  .links{margin-top:26px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px}
  .links a{color:var(--muted);text-decoration:none}
  .links a:hover{color:var(--green)}
</style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="/favicon.svg" alt="" width="56" height="56">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Дневник на месте, он на главной.</p>
    <a class="btn" href="/">На главную</a>
    <div class="links">
      <a href="/legal/">Документы</a>
      <a href="/onboarding/">Прототип</a>
    </div>
  </div>
</body>
</html>
