# EasyFood — food.fastclass.ru, только HTTP.
#
# Нужен на первом этапе: полный конфиг food.fastclass.ru.conf ссылается
# на сертификат Let's Encrypt, которого ещё нет, и nginx не может запуститься.
#
# Порядок установки:
#   1) cp deploy/nginx/food.fastclass.ru.http.conf \
#         /etc/nginx/sites-available/food.fastclass.ru
#      mkdir -p /var/www/certbot
#      nginx -t && systemctl reload nginx
#   2) certbot --nginx -d food.fastclass.ru --agree-tos -m <ваш_email> --redirect
#   3) cp deploy/nginx/food.fastclass.ru.conf \
#         /etc/nginx/sites-available/food.fastclass.ru
#      nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name food.fastclass.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
