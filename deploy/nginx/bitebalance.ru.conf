# BiteBalance — bitebalance.ru
#
# Раскладка на сервере:
#   /var/www/bitebalance/   лендинг (index.html, calculator/, onboarding/, legal/)
#   /app/                   проксируется в контейнер, он отдаёт собранное SPA
#   /api/                   проксируется в тот же контейнер
#
# Сборка приложения идёт с APP_BASE=/app/ (см. Dockerfile), тогда index.html
# ссылается на /app/assets/*, а неавторизованный пользователь уходит на корень.
#
# Установка:
#   cp deploy/nginx/bitebalance.ru.conf /etc/nginx/sites-available/bitebalance.ru
#   ln -sf /etc/nginx/sites-available/bitebalance.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bitebalance.ru www.bitebalance.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bitebalance.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bitebalance.ru;

    ssl_certificate     /etc/letsencrypt/live/bitebalance.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitebalance.ru/privkey.pem;

    return 301 https://bitebalance.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bitebalance.ru;

    root /var/www/bitebalance;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/bitebalance.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitebalance.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Распознавание блюд по фото отправляет картинку.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    access_log /var/log/nginx/bitebalance.ru.access.log;
    error_log  /var/log/nginx/bitebalance.ru.error.log;

    # --- приложение: всё /app/ уходит в контейнер, он отдаёт SPA ---
    location = /app {
        return 301 /app/$is_args$args;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # --- API ---
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    # --- лендинг ---
    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # Юридические документы и калькулятор кэшируем недолго
    location ~* ^/(legal|calculator|onboarding)/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Service worker и манифест всегда свежие
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|svg|webp|png|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
