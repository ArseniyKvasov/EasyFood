# BiteBalance — bitebalance.ru
#
# Контейнер сам отдаёт и лендинг (корень), и приложение (/app/), и API (/api/).
# nginx только терминирует TLS и проксирует.
#
# Установка:
#   cp deploy/nginx/bitebalance.ru.conf /etc/nginx/sites-available/bitebalance.ru
#   ln -sf /etc/nginx/sites-available/bitebalance.ru /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/food.fastclass.ru
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bitebalance.ru www.bitebalance.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bitebalance.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bitebalance.ru;

    ssl_certificate     /etc/letsencrypt/live/bitebalance.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitebalance.ru/privkey.pem;

    return 301 https://bitebalance.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bitebalance.ru;

    ssl_certificate     /etc/letsencrypt/live/bitebalance.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitebalance.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Распознавание блюд по фото отправляет картинку.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    access_log /var/log/nginx/bitebalance.ru.access.log;
    error_log  /var/log/nginx/bitebalance.ru.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}
