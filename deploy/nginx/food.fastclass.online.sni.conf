# EasyFood — food.fastclass.online
# Вариант для сервера, где публичный 443 обслуживает stream-прокси
# с маршрутизацией по SNI (например, /etc/nginx/stream-xray.conf).
#
# В этом случае TLS-рукопожатие завершает не http-слой, а тот backend,
# куда stream отправит соединение по имени из SNI. Поэтому сайт слушает
# только локальный порт, а в map добавляется строка для нашего домена.
#
# Установка:
#   1) в /etc/nginx/stream-xray.conf добавить в map:
#        food.fastclass.online 127.0.0.1:8447;
#      и отдельный server:
#        server {
#            listen 127.0.0.1:8447;
#            proxy_pass 127.0.0.1:8448;
#            proxy_protocol on;
#        }
#      (готовый фрагмент — deploy/nginx/stream-food.fastclass.online.conf)
#
#   2) mkdir -p /var/www/certbot
#   3) cp deploy/nginx/food.fastclass.online.sni.conf \
#         /etc/nginx/sites-available/food.fastclass.online
#   4) nginx -t && systemctl reload nginx

# Публичный HTTP: ACME-challenge и редирект на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name food.fastclass.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: соединение сюда приходит от stream-прокси с PROXY-заголовком.
server {
    listen 127.0.0.1:8448 proxy_protocol ssl http2;
    listen [::]:8448 proxy_protocol ssl http2;
    server_name food.fastclass.online;

    ssl_certificate     /etc/letsencrypt/live/food.fastclass.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food.fastclass.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Распознавание блюд по фото отправляет картинку — нужен больший лимит.
    client_max_body_size 12m;

    # Камера работает только в защищённом контексте.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    access_log /var/log/nginx/food.fastclass.online.access.log;
    error_log  /var/log/nginx/food.fastclass.online.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For   $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    # Статика: кэшируем на год, имя файла содержит хеш.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
