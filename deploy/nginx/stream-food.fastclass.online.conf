# Фрагмент для /etc/nginx/stream-xray.conf
#
# На сервере публичный 443 слушает stream-прокси, который по SNI решает,
# в какой backend отправить соединение. Без строки в map домен уходит
# в default-ветку и получает чужой сертификат.
#
# Вставьте две части:
#
# 1) В map $ssl_preread_server_name $backend — строку для нашего домена:
#
#      map $ssl_preread_server_name $backend {
#          yandex.ru 127.0.0.1:8445;
#          food.fastclass.online 127.0.0.1:8447;
#          default 127.0.0.1:8446;
#      }
#
# 2) Отдельный server в блоке stream — пересылка на http-слой
#    с PROXY-заголовком (там завершается TLS):
#
#      server {
#          listen 127.0.0.1:8447;
#          proxy_pass 127.0.0.1:8448;
#          proxy_protocol on;
#      }
#
# Порт 8448 на стороне http-слоя описан в
# deploy/nginx/food.fastclass.online.sni.conf

map $ssl_preread_server_name $backend {
    yandex.ru 127.0.0.1:8445;
    food.fastclass.online 127.0.0.1:8447;
    default 127.0.0.1:8446;
}

server {
    listen 127.0.0.1:8447;
    proxy_pass 127.0.0.1:8448;
    proxy_protocol on;
}
